<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ImagePadServer macOS app icon</title>
  <desc id="desc">A rounded blue app tile behind a diamond PAD projecting a floating photo that turns into encoded square data boxes.</desc>
  <defs>
    <linearGradient id="tile" x1="140" y1="60" x2="884" y2="964" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#061A35"/>
      <stop offset="0.52" stop-color="#0A3C70"/>
      <stop offset="1" stop-color="#02101F"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="512" cy="786" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#41E9FF" stop-opacity="0.44"/>
      <stop offset="0.52" stop-color="#1485C2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#02101F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="500" y1="700" x2="610" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DFFFF" stop-opacity="0.44"/>
      <stop offset="0.52" stop-color="#49EFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#49EFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="padGlow" cx="512" cy="762" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DFFFFF" stop-opacity="0.88"/>
      <stop offset="0.46" stop-color="#41E9FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#41E9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="padTop" x1="280" y1="612" x2="744" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFFFFF"/>
      <stop offset="0.22" stop-color="#62F3FF"/>
      <stop offset="0.62" stop-color="#146196"/>
      <stop offset="1" stop-color="#061221"/>
    </linearGradient>
    <linearGradient id="padInner" x1="340" y1="672" x2="680" y2="808" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DFFFFF" stop-opacity="0.90"/>
      <stop offset="0.55" stop-color="#45EDFF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#0D7DBD" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="photoFace" x1="300" y1="230" x2="730" y2="572" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#F0FBFF"/>
      <stop offset="1" stop-color="#BDEFFF"/>
    </linearGradient>
    <linearGradient id="photoEdge" x1="280" y1="270" x2="782" y2="604" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#C7FBFF"/>
      <stop offset="1" stop-color="#18C5F5"/>
    </linearGradient>
    <linearGradient id="mountainA" x1="310" y1="430" x2="590" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0875D8"/>
      <stop offset="0.58" stop-color="#1AA8F0"/>
      <stop offset="1" stop-color="#6DEEFF"/>
    </linearGradient>
    <linearGradient id="mountainB" x1="540" y1="430" x2="760" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2197E8"/>
      <stop offset="1" stop-color="#77EAFF"/>
    </linearGradient>
    <radialGradient id="sun" cx="630" cy="322" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE66B"/>
      <stop offset="0.62" stop-color="#FFB93E"/>
      <stop offset="1" stop-color="#FF7E3E"/>
    </radialGradient>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="#001126" flood-opacity="0.38"/>
    </filter>
    <filter id="padShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="26" stdDeviation="18" flood-color="#001126" flood-opacity="0.44"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#41E9FF" flood-opacity="0.28"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="32" y="32" width="960" height="960" rx="212" ry="212"/>
    </clipPath>
    <clipPath id="photoClip">
      <path d="M321 314C327 272 357 246 402 241L676 211C721 206 754 231 760 275L789 497C795 545 767 581 717 587L354 629C304 635 273 606 279 556Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect x="32" y="32" width="960" height="960" fill="url(#tile)"/>
    <ellipse cx="512" cy="842" rx="426" ry="180" fill="url(#floorGlow)"/>

    <g id="projection" opacity="0.96">
      <path d="M365 706L662 706L724 442L584 333L432 363Z" fill="url(#beam)"/>
      <path d="M438 706L568 706L600 366L496 354Z" fill="#BFFFFF" opacity="0.16"/>
    </g>

    <g id="floor-pad" filter="url(#padShadow)">
      <ellipse cx="512" cy="848" rx="320" ry="74" fill="#001126" opacity="0.36"/>
      <path d="M512 626L842 766L512 908L182 766Z" fill="#030711" opacity="0.64"/>
      <path d="M512 586L842 728L512 872L182 728Z" fill="url(#padTop)"/>
      <path d="M512 652L714 730L512 812L310 730Z" fill="url(#padInner)" stroke="#D7FFFF" stroke-width="18" stroke-linejoin="round"/>
      <path d="M306 715L512 624L724 715" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.34"/>
      <ellipse cx="512" cy="740" rx="238" ry="110" fill="url(#padGlow)"/>
    </g>

    <g id="floating-photo" filter="url(#softShadow)" transform="rotate(-6 520 420)">
      <path d="M343 333C349 289 379 262 426 257L689 228C734 223 768 248 774 293L802 496C809 546 780 583 729 590L367 631C315 637 283 607 289 554Z" fill="url(#photoEdge)"/>
      <path d="M321 314C327 272 357 246 402 241L676 211C721 206 754 231 760 275L789 497C795 545 767 581 717 587L354 629C304 635 273 606 279 556Z" fill="url(#photoFace)"/>
      <g clip-path="url(#photoClip)">
        <path d="M279 556L456 392C469 380 485 383 495 398L620 560Z" fill="url(#mountainA)"/>
        <path d="M544 544L649 432C661 420 677 420 689 434L810 564Z" fill="url(#mountainB)" opacity="0.94"/>
        <circle cx="634" cy="325" r="48" fill="url(#sun)"/>
        <path d="M348 286L718 245C738 243 754 254 758 273" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.52"/>
        <path d="M310 334L294 542C291 584 314 608 354 605" fill="#FFFFFF" opacity="0.14"/>
      </g>
      <path d="M321 314C327 272 357 246 402 241L676 211C721 206 754 231 760 275L789 497C795 545 767 581 717 587L354 629C304 635 273 606 279 556Z" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" opacity="0.92"/>
      <path d="M340 323C344 288 369 268 409 264L674 235C711 231 738 250 743 286L768 489C773 529 750 557 710 562L362 601C322 606 299 584 304 546Z" fill="none" stroke="#8CF5FF" stroke-width="7" stroke-linejoin="round" opacity="0.72"/>
    </g>

    <g id="encoded-data" fill="#91FFFF" filter="url(#softShadow)">
      <rect x="706" y="284" width="42" height="42" rx="8"/>
      <rect x="764" y="316" width="34" height="34" rx="7" opacity="0.92"/>
      <rect x="730" y="370" width="38" height="38" rx="8" opacity="0.86"/>
      <rect x="672" y="392" width="34" height="34" rx="7" opacity="0.80"/>
      <rect x="744" y="440" width="30" height="30" rx="7" opacity="0.74"/>
      <rect x="684" y="476" width="29" height="29" rx="6" opacity="0.68"/>
      <rect x="716" y="526" width="25" height="25" rx="6" opacity="0.62"/>
      <rect x="650" y="562" width="24" height="24" rx="6" opacity="0.56"/>
      <rect x="612" y="626" width="21" height="21" rx="5" opacity="0.50"/>
    </g>

    <path d="M170 154C252 92 382 76 532 76" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.10"/>
  </g>
</svg>
