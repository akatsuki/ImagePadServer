name: GPU Linux contract

on:
  workflow_dispatch:
  push:
    paths:
      - "gpu/playlist-compositord/**"
      - "scripts/run-gpu-linux-contract.sh"
      - ".github/workflows/gpu-linux-contract.yml"

permissions:
  contents: read

jobs:
  linux-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Linux sidecar contract
        run: ./scripts/run-gpu-linux-contract.sh
