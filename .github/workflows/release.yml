name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish (for example v1.9.0)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  nico-compositor:
    uses: ./.github/workflows/nico-compositor.yml
    with:
      ref: ${{ inputs.release_tag || github.ref }}

  xpost-compositor:
    uses: ./.github/workflows/xpost-compositor.yml
    with:
      ref: ${{ inputs.release_tag || github.ref }}

  build:
    name: Build release assets
    needs: [nico-compositor, xpost-compositor]
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Require matching tag and draft release
        shell: bash
        run: |
          case "$RELEASE_TAG" in v[0-9]*) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          version="$(sed -n 's/.*Version[[:space:]]*=[[:space:]]*"\(v[^"]*\)".*/\1/p' internal/about/about.go | head -n 1)"
          test "$version" = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - name: Prepare X fetcher dependencies before verification
        run: npm ci --prefix internal/xpostimage
      - name: Install media test tools
        run: |
          brew install ffmpeg webp
          echo "IMAGEPAD_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "IMAGEPAD_FFPROBE=$(command -v ffprobe)" >> "$GITHUB_ENV"
      - name: Verify X fetcher media and UTF-16 entity handling
        run: node --test internal/xpostimage/tweet_media_test.mjs internal/xpostimage/video_media_test.mjs internal/xpostimage/text_entities_test.mjs
      # Media tests launch and clean up FFmpeg processes; isolate packages.
      - run: go test -p 1 ./...
      - name: Check archive gate regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*airplay*archive.py'
      - name: Fetch and validate exact runtime and corresponding sources
        run: python3 scripts/prepare-airplay-release.py --inputs "$RUNNER_TEMP/airplay" --download --env-file "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: nico-compositor-payload
          path: internal/nicorender
      - uses: actions/download-artifact@v4
        with:
          pattern: xpost-compositor-*
          path: build/xpost-artifacts
      - name: Stage target-specific X compositors
        shell: bash
        run: |
          mkdir -p build/xpost-payload
          for payload in build/xpost-artifacts/xpost-compositor-*; do
            target="${payload##*/xpost-compositor-}"
            mv "$payload" "build/xpost-payload/$target"
          done
      - run: sh scripts/build-release.sh
      - name: Build and verify GPU sidecar artifact
        run: |
          sh scripts/build-gpu-sidecar.sh
          sh scripts/verify-gpu-artifacts.sh
      - name: Upload built assets to draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/**/win/*.zip
            dist/**/linux/imagepadserver-*
            dist/**/mac/imagepadserver-*-macos-universal.zip
            dist/gpu/**

  windows-runtime:
    name: Verify embedded Windows runtime
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch and validate exact runtime and corresponding sources
        run: python scripts/prepare-airplay-release.py --inputs "$env:RUNNER_TEMP/airplay" --download
      - name: Verify fresh offline installation and source access
        run: go test -tags airplay_runtime_embedded ./internal/airplay ./internal/server -run 'TestPreparePinnedAirPlayRuntimeFromEmbeddedArchive|TestRuntimeLicense|TestRuntimeSourceDistribution|TestAirPlayLicense' -count=1

  publish:
    name: Publish only after all release gates pass
    needs: [build, windows-runtime]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Recheck source availability and publish
        shell: bash
        run: |
          python3 scripts/prepare-airplay-release.py --inputs "$RUNNER_TEMP/airplay" --download
          if [[ "$RELEASE_TAG" == *-dev* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
